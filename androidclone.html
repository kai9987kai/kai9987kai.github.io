<style>

<body>
<div id="device" aria-label="NovaDroid simulated Android device">

  </div>

    </div>

  <section id="lock" class="layer wallpaper" aria-label="Lock screen">

    <div class="lock-hint"><span class="chev">⌃</span><span>Swipe up to unlock</span></div>
  </section>

  <section id="drawer" class="layer scroll" aria-label="App drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-search"><span>⌕</span><input id="drawer-query" autocomplete="off" placeholder="Search apps" aria-label="Search apps"><button class="icon-btn" onclick="closeDrawer()" aria-label="Close app drawer">×</button></div>
    <div id="drawer-grid" class="drawer-grid"></div>
  </section>

  <section id="shade" class="layer scroll" aria-label="Notifications and quick settings">
    <div class="shade-top"><div><div id="shade-time" class="shade-clock">12:00</div><div id="shade-date" class="shade-date">Saturday, 3 October</div></div><button class="icon-btn" onclick="openApp('settings')" aria-label="Open settings">⚙</button></div>
    <div id="qs-grid" class="qs-grid"></div>
    <div class="slider-card"><span>☀</span><input id="brightness" type="range" min="45" max="115" value="100" aria-label="Brightness"><span id="brightness-value">100%</span></div>
    <div class="slider-card"><span>◖</span><input id="volume" type="range" min="0" max="100" value="65" aria-label="Volume"><span id="volume-value">65%</span></div>
    <div class="notif-title"><span>Notifications</span><button onclick="clearNotifications()" style="background:transparent;color:#fff;font-weight:700">Clear</button></div>
    <div id="notifications"></div><div class="shade-handle"></div>
  </section>

  <main id="app-window" class="layer" aria-live="polite"></main>

  <section id="recents" class="layer scroll" aria-label="Recent apps"><h2 class="recents-title">Recent apps</h2><div id="recent-list"></div><button class="clear-recents" onclick="clearRecents()">Clear all</button></section>

  <section id="palette" class="layer" aria-label="Command palette"><div class="palette-box"><input id="palette-query" autocomplete="off" placeholder="Search apps, settings and commands…" aria-label="Command palette search"><div id="palette-list" class="scroll" style="max-height:430px;margin-top:8px"></div></div></section>

  <section id="modal" class="layer" role="dialog" aria-modal="true"><div id="dialog" class="dialog"></div></section>
  <div id="toast" role="status"></div>
  <div class="navbar"><div class="gesture-pill"></div></div>
  <div id="status-touch" aria-hidden="true"></div><div id="edge-back-zone" aria-hidden="true"></div><div id="gesture-zone" aria-hidden="true"></div>
</div>

function systemBack(){if($('#modal').classList.contains('open'))return closeModal();if($('#palette').classList.contains('open'))return closePalette();if($('#recents').classList.contains('open'))return hideRecents();if(state.shade)return closeShade();if(state.drawer)return closeDrawer();if(!state.currentApp)return;const special=handleAppBack();if(special)return;if(appStack.length){const previous=appStack.pop();return openApp(previous,{pushHistory:false,fromBack:true})}closeApp()}
function handleAppBack(){if(state.currentApp==='messages'&&currentChatId){currentChatId=null;renderCurrentApp();return true}if(state.currentApp==='mail'&&currentEmailId){currentEmailId=null;renderCurrentApp();return true}if(state.currentApp==='notes'&&editingNoteId){editingNoteId=null;renderCurrentApp();return true}if(state.currentApp==='photos'&&$('#photo-viewer')){closePhotoViewer();return true}return false}

function openApp(id,opts={}){if(state.locked)return;const app=appById(id);if(!app)return;const {pushHistory=true,fromBack=false}=opts;closeShade();closeDrawer();hideRecents();closePalette();if(closeTimer){clearTimeout(closeTimer);closeTimer=null}const previous=state.currentApp;if(previous&&previous!==id){cleanupApp(previous);if(pushHistory)appStack.push(previous)}if(previous===id&&!fromBack){resetAppWindowVisuals();return renderCurrentApp()}state.currentApp=id;state.recents=[id,...state.recents.filter(x=>x!==id)].slice(0,8);saveState();const w=$('#app-window');w.classList.remove('closing');w.classList.add('visible');resetAppWindowVisuals();if(previous&&previous!==id){w.classList.remove('app-switch-flash');void w.offsetWidth;w.classList.add('app-switch-flash')}renderCurrentApp();updateStatusBarTone();haptic()}

function cleanupApp(id){if(id==='camera')cleanupCamera();if(id==='photos')revokePhotoObjectUrls();if(id==='clock'){if(stopwatch.timer){clearInterval(stopwatch.timer);stopwatch.timer=null}if(timerState.timer){clearInterval(timerState.timer);timerState.timer=null}}}

function bindSystemGestures(){let sy=0,sx=0,edge=false,homeSwipe=false,holdTimer=null,startApp=false,moved=false;const lock=$('#lock');lock.addEventListener('pointerdown',e=>{sy=e.clientY});lock.addEventListener('pointerup',e=>{if(sy-e.clientY>45)unlock()});$('#status-touch').addEventListener('pointerdown',e=>{sy=e.clientY});$('#status-touch').addEventListener('pointerup',e=>{if(e.clientY-sy>22)openShade()});const gz=$('#gesture-zone');gz.addEventListener('pointerdown',e=>{sy=e.clientY;homeSwipe=true;moved=false;startApp=!!state.currentApp;clearTimeout(holdTimer);try{gz.setPointerCapture(e.pointerId)}catch{}holdTimer=setTimeout(()=>{if(homeSwipe&&startApp&&!moved){homeSwipe=false;showRecents();haptic(18)}},420)});gz.addEventListener('pointermove',e=>{if(!homeSwipe)return;const dy=Math.abs(e.clientY-sy);if(dy>12)moved=true;if(dy>18)clearTimeout(holdTimer)});gz.addEventListener('pointerup',e=>{clearTimeout(holdTimer);if(!homeSwipe)return;const dy=sy-e.clientY;if(startApp){if(dy>25||Math.abs(dy)<10)goHome()}else if(dy>55){openDrawer()}homeSwipe=false;moved=false});gz.addEventListener('pointercancel',()=>{clearTimeout(holdTimer);homeSwipe=false;moved=false});const edgeZone=$('#edge-back-zone');edgeZone.addEventListener('pointerdown',e=>{if(!state.currentApp)return;edge=true;sx=e.clientX;edgeZone.setPointerCapture(e.pointerId)});edgeZone.addEventListener('pointermove',e=>{if(!edge)return;const dx=clamp(e.clientX-sx,0,150),p=dx/150;const w=$('#app-window');w.style.transform=`translateX(${dx*.45}px) scale(${1-p*.035})`;w.style.borderRadius=`${p*34}px`;w.style.opacity=String(1-p*.18)});const finishEdge=e=>{if(!edge)return;edge=false;const dx=e.clientX-sx;if(dx>85)systemBack();else resetAppWindowVisuals()};edgeZone.addEventListener('pointerup',finishEdge);edgeZone.addEventListener('pointercancel',()=>{edge=false;resetAppWindowVisuals()});}
function bindGlobalKeys(){document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();systemBack();return}if(e.key==='Escape'){e.preventDefault();systemBack();return}if(e.key==='Home'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();goHome()}})}
function bindRanges(){$('#brightness').addEventListener('input',e=>{state.settings.brightness=+e.target.value;document.documentElement.style.setProperty('--device-brightness',state.settings.brightness/100);$('#brightness-value').textContent=`${state.settings.brightness}%`;saveState()});$('#volume').addEventListener('input',e=>{state.settings.volume=+e.target.value;$('#volume-value').textContent=`${state.settings.volume}%`;saveState()})}

function toggleSetting(id){state.settings[id]=!state.settings[id];if(id==='airplane'&&state.settings.airplane){state.settings.wifi=false;state.settings.bluetooth=false}if((id==='wifi'||id==='bluetooth')&&state.settings[id])state.settings.airplane=false;persist();if(id==='keepAwake')syncWakeLock();haptic();if(state.currentApp==='settings')renderSettings()}

function openPalette(){if(state.locked)return;$('#palette').classList.add('open');$('#palette-query').value='';renderPalette('');updateStatusBarTone();setTimeout(()=>$('#palette-query').focus(),40)}

function renderPalette(q=''){const n=q.trim().toLowerCase();const actions=[{name:'Open notification shade',run:'openShade()',key:'Quick settings'},{name:'Toggle dark theme',run:"toggleSetting('dark')",key:'Appearance'},{name:'Go home',run:'goHome()',key:'Navigation'},{name:'Show recent apps',run:'showRecents()',key:'Navigation'}];const apps=APPS.filter(a=>!n||a.name.toLowerCase().includes(n)||a.id.includes(n)).map(a=>`<div class="palette-item" onclick="openApp('${a.id}')"><span class="recent-icon" style="background:${a.color}">${a.icon}</span><div><b>${esc(a.name)}</b><div class="sub">App</div></div></div>`);const acts=actions.filter(a=>!n||a.name.toLowerCase().includes(n)||a.key.toLowerCase().includes(n)).map(a=>`<div class="palette-item" onclick="closePalette();${a.run}"><span class="recent-icon" style="background:var(--surface-3);color:var(--text)">⌘</span><div><b>${esc(a.name)}</b><div class="sub">${esc(a.key)}</div></div></div>`);$('#palette-list').innerHTML=[...apps,...acts].join('')||'<div class="empty">No results</div>'}

let toastTimer;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}
function showModal({title,body='',fields=[],confirm='Save',danger=false,onConfirm}){lastFocused=document.activeElement;const f=fields.map(x=>x.type==='textarea'?`<textarea id="dlg-${x.id}" placeholder="${esc(x.placeholder||'')}">${esc(x.value||'')}</textarea>`:`<input id="dlg-${x.id}" type="${esc(x.type||'text')}" placeholder="${esc(x.placeholder||'')}" value="${esc(x.value||'')}">`).join('');$('#dialog').innerHTML=`<h2 id="dialog-title">${esc(title)}</h2>${body?`<p>${body}</p>`:''}${f}<div class="dialog-actions"><button onclick="closeModal()">Cancel</button><button id="dlg-confirm" class="primary" style="${danger?'background:#c73643':''}">${esc(confirm)}</button></div>`;$('#modal').setAttribute('aria-labelledby','dialog-title');$('#modal').classList.add('open');updateStatusBarTone();$('#dlg-confirm').onclick=async()=>{const values={};fields.forEach(x=>values[x.id]=$(`#dlg-${x.id}`)?.value||'');try{await onConfirm?.(values);closeModal()}catch(e){recordRuntimeError('dialog',e);toast('Action failed — see Device Lab')}};setTimeout(()=>{const target=fields[0]?$(`#dlg-${fields[0].id}`):$('#dlg-confirm');target?.focus()},30)}

/* Calculator: tokenized recursive-descent parser; no eval/new Function. */
let calcExpr='';
function renderCalculator(){const keys=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='];$('#app-window').innerHTML=`<section class="app-page">${appBar('Calculator')}<div class="calc-display"><div id="calc-expression" class="calc-expression">${esc(calcExpr||' ')}</div><div id="calc-result" class="calc-result">${calcPreview()}</div></div><div class="calc-grid">${keys.map(k=>`<button class="${['÷','×','−','+','(',')'].includes(k)?'op':''} ${k==='='?'eq':''}" onclick="calcPress('${k}')">${k}</button>`).join('')}</div></section>`}
function calcPress(k){haptic(8);if(k==='C')calcExpr='';else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);else if(k==='='){try{calcExpr=String(roundSmart(parseMath(calcExpr)))}catch{toast('Invalid expression')}}else calcExpr+=k;renderCalculator()}
function calcPreview(){if(!calcExpr)return'0';try{return esc(String(roundSmart(parseMath(calcExpr))))}catch{return esc(calcExpr.slice(-12))}}
function roundSmart(n){if(!Number.isFinite(n))throw Error();return Math.round((n+Number.EPSILON)*1e10)/1e10}
function parseMath(input){const s=input.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s/g,'');let i=0;function num(){if(s[i]==='('){i++;const v=expr();if(s[i++]!==')')throw Error();return v}let start=i;if(s[i]==='+'||s[i]==='-')i++;while(/[0-9.]/.test(s[i]||''))i++;if(start===i)throw Error();const v=Number(s.slice(start,i));if(!Number.isFinite(v))throw Error();return v}function term(){let v=num();while(s[i]==='*'||s[i]==='/'){const op=s[i++],r=num();v=op==='*'?v*r:v/r}return v}function expr(){let v=term();while(s[i]==='+'||s[i]==='-'){const op=s[i++],r=term();v=op==='+'?v+r:v-r}return v}const v=expr();if(i!==s.length)throw Error();return v}

function renderClock(){const tab=window.clockTab||'clock';$('#app-window').innerHTML=`<section class="app-page">${appBar('Clock')}<div class="segmented" style="margin:0 16px"><button class="${tab==='clock'?'active':''}" onclick="clockTab='clock';renderClock()">Clock</button><button class="${tab==='stopwatch'?'active':''}" onclick="clockTab='stopwatch';renderClock()">Stopwatch</button><button class="${tab==='timer'?'active':''}" onclick="clockTab='timer';renderClock()">Timer</button></div><div id="clock-body" style="flex:1;display:flex;flex-direction:column;justify-content:center"></div></section>`;if(tab==='clock')renderClockFace();if(tab==='stopwatch')renderStopwatch();if(tab==='timer')renderTimer()}
function renderClockFace(){$('#clock-body').innerHTML=`<div class="clock-face"><i id="h-hand" class="hand hour"></i><i id="m-hand" class="hand minute"></i><i id="s-hand" class="hand second"></i></div><div id="digital-clock" style="text-align:center;font-size:38px;font-weight:350"></div>`;updateClockHands()}
function updateClockHands(){const d=new Date();$('#h-hand')?.style.setProperty('transform',`translateX(-50%) rotate(${(d.getHours()%12)*30+d.getMinutes()/2}deg)`);$('#m-hand')?.style.setProperty('transform',`translateX(-50%) rotate(${d.getMinutes()*6+d.getSeconds()*.1}deg)`);$('#s-hand')?.style.setProperty('transform',`translateX(-50%) rotate(${d.getSeconds()*6}deg)`);if($('#digital-clock'))$('#digital-clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function formatMs(ms){const total=Math.max(0,ms),m=Math.floor(total/60000),s=Math.floor(total/1000)%60,cs=Math.floor(total/10)%100;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`}
function renderStopwatch(){const elapsed=stopwatch.running?Date.now()-stopwatch.start:stopwatch.elapsed;$('#clock-body').innerHTML=`<div id="sw-time" style="font:300 58px ui-monospace;text-align:center;letter-spacing:-3px">${formatMs(elapsed)}</div><div style="display:flex;gap:16px;justify-content:center;margin-top:34px"><button class="icon-btn" onclick="resetStopwatch()">↺</button><button class="icon-btn seed-bg" onclick="toggleStopwatch()">${stopwatch.running?'Ⅱ':'▶'}</button></div>`;if(stopwatch.running&&!stopwatch.timer)stopwatch.timer=setInterval(()=>{if($('#sw-time'))$('#sw-time').textContent=formatMs(Date.now()-stopwatch.start)},31)}
function toggleStopwatch(){if(stopwatch.running){stopwatch.elapsed=Date.now()-stopwatch.start;stopwatch.running=false;clearInterval(stopwatch.timer);stopwatch.timer=null}else{stopwatch.running=true;stopwatch.start=Date.now()-stopwatch.elapsed}renderStopwatch()}
function resetStopwatch(){stopwatch.running=false;stopwatch.elapsed=0;clearInterval(stopwatch.timer);stopwatch.timer=null;renderStopwatch()}
function renderTimer(){const left=timerState.running?Math.max(0,timerState.end-Date.now()):timerState.left;$('#clock-body').innerHTML=`<div id="timer-time" style="font:300 58px ui-monospace;text-align:center;letter-spacing:-3px">${formatTimer(left)}</div><div style="text-align:center;margin-top:16px"><button class="chip" onclick="setTimerMinutes(1)">1 min</button> <button class="chip" onclick="setTimerMinutes(5)">5 min</button> <button class="chip" onclick="setTimerMinutes(10)">10 min</button></div><div style="display:flex;gap:16px;justify-content:center;margin-top:26px"><button class="icon-btn" onclick="resetTimer()">↺</button><button class="icon-btn seed-bg" onclick="toggleTimer()">${timerState.running?'Ⅱ':'▶'}</button></div>`;if(timerState.running&&!timerState.timer)timerState.timer=setInterval(updateTimer,250);if(timerState.running)scheduleTimerFinish()}
function formatTimer(ms){const sec=Math.ceil(ms/1000);return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function setTimerMinutes(m){timerState.running=false;clearInterval(timerState.timer);timerState.timer=null;clearTimeout(timerState.finishTimeout);timerState.finishTimeout=null;timerState.left=m*60000;renderTimer()}
function toggleTimer(){if(timerState.running){timerState.left=Math.max(0,timerState.end-Date.now());timerState.running=false;clearInterval(timerState.timer);timerState.timer=null;clearTimeout(timerState.finishTimeout);timerState.finishTimeout=null}else{if(timerState.left<=0)timerState.left=300000;timerState.running=true;timerState.end=Date.now()+timerState.left;scheduleTimerFinish()}renderTimer()}
function scheduleTimerFinish(){clearTimeout(timerState.finishTimeout);timerState.finishTimeout=null;if(!timerState.running)return;const delay=Math.max(0,timerState.end-Date.now());timerState.finishTimeout=setTimeout(finishTimer,Math.min(delay,2147483647))}
function finishTimer(){if(!timerState.running)return;if(timerState.end>Date.now()+50)return scheduleTimerFinish();timerState.running=false;timerState.left=0;clearInterval(timerState.timer);timerState.timer=null;timerState.finishTimeout=null;notify('Clock','Timer finished','Your NovaDroid timer has ended.');toast('Timer finished');haptic([60,60,60]);if(state.currentApp==='clock'&&(window.clockTab||'clock')==='timer')renderTimer()}
function updateTimer(){const left=Math.max(0,timerState.end-Date.now());if($('#timer-time'))$('#timer-time').textContent=formatTimer(left);if(left<=0)finishTimer()}
function resetTimer(){timerState.running=false;timerState.left=300000;clearInterval(timerState.timer);timerState.timer=null;clearTimeout(timerState.finishTimeout);timerState.finishTimeout=null;renderTimer()}

function renderNotes(){if(editingNoteId){const n=state.notes.find(n=>n.id===editingNoteId)||{title:'',body:''};$('#app-window').innerHTML=`<section class="app-page">${appBar('Edit note',iconButton('Save','✓','saveNote()'))}<input id="note-title" value="${esc(n.title)}" placeholder="Title" style="margin:4px 16px 0;border:0;background:transparent;color:var(--text);font-size:28px;font-weight:750;outline:0"><textarea id="note-body" placeholder="Start writing…" style="flex:1;margin:8px 16px 16px;border:0;background:transparent;color:var(--text);resize:none;outline:0;font-size:16px;line-height:1.55">${esc(n.body)}</textarea><button onclick="deleteNote('${n.id}')" style="margin:0 16px 14px;border-radius:999px;padding:11px;background:#c73643;color:white;font-weight:800">Delete note</button></section>`;return}$('#app-window').innerHTML=`<section class="app-page">${appBar('Notes')}<div class="scroll" style="padding:0 14px 90px">${state.notes.length?state.notes.sort((a,b)=>b.updated-a.updated).map(n=>`<article class="card note-card" style="margin-bottom:10px" onclick="editNote('${n.id}')"><h3>${esc(n.title||'Untitled')}</h3><p>${esc(n.body||'Empty note')}</p><div class="sub" style="margin-top:10px">${new Date(n.updated).toLocaleString()}</div></article>`).join(''):'<div class="empty">No notes yet</div>'}</div><button class="fab" onclick="newNote()" aria-label="New note">+</button></section>`}

function renderSettings(){const s=state.settings;const sw=(id,on)=>`<button class="switch ${on?'on':''}" onclick="toggleSetting('${id}')" aria-label="Toggle ${id}"></button>`;const accents=['#6f7cff','#00a37a','#d65c8f','#ef7d45','#7b61d1'];$('#app-window').innerHTML=`<section class="app-page">${appBar('Settings')}<div class="scroll" style="padding-bottom:30px"><div class="settings-section"><h2>Connections</h2><div class="setting-row"><span class="avatar" style="background:#3f80e8">◒</span><div class="grow"><div class="title">Wi‑Fi</div><div class="sub">${s.wifi?'On':'Off'}</div></div>${sw('wifi',s.wifi)}</div><div class="setting-row"><span class="avatar" style="background:#5278e8">ᛒ</span><div class="grow"><div class="title">Bluetooth</div><div class="sub">${s.bluetooth?'On':'Off'}</div></div>${sw('bluetooth',s.bluetooth)}</div></div><div class="settings-section"><h2>Appearance</h2><div class="setting-row"><div class="grow"><div class="title">Dark theme</div><div class="sub">System-wide simulated theme</div></div>${sw('dark',s.dark)}</div><div class="setting-row"><div class="grow"><div class="title">Accent colour</div><div class="sub">Dynamic colour seed</div></div><div class="palette-dots">${accents.map(c=>`<button class="${s.accent===c?'active':''}" style="background:${c}" onclick="setAccent('${c}')" aria-label="Set accent ${c}"></button>`).join('')}</div></div><div class="setting-row" onclick="nextWallpaper()" style="cursor:pointer"><div class="grow"><div class="title">Wallpaper</div><div class="sub">Tap to cycle wallpaper</div></div><span>›</span></div></div><div class="settings-section"><h2>Interaction</h2><div class="setting-row"><div class="grow"><div class="title">Reduce motion</div><div class="sub">Minimise transitions and animations</div></div>${sw('reduceMotion',s.reduceMotion)}</div><div class="setting-row"><div class="grow"><div class="title">Haptics</div><div class="sub">Uses vibration when supported</div></div>${sw('haptics',s.haptics)}</div><div class="setting-row"><div class="grow"><div class="title">Keep screen awake</div><div class="sub">Uses the Screen Wake Lock API when the browser permits it</div></div>${sw('keepAwake',s.keepAwake)}</div></div><div class="settings-section"><h2>Data & resilience</h2><div class="setting-row"><div class="grow"><div class="title">Backup & restore</div><div class="sub">Export or import your local NovaDroid state</div><div class="action-row"><button onclick="exportBackup()">Export backup</button><button onclick="importBackup()">Import backup</button></div></div></div></div><div class="settings-section"><h2>System</h2><div class="setting-row" onclick="openApp('lab')" style="cursor:pointer"><div class="grow"><div class="title">Device Lab</div><div class="sub">Browser capabilities, runtime errors & self-test</div></div><span>›</span></div><div class="setting-row" onclick="toggleFullscreen()" style="cursor:pointer"><div class="grow"><div class="title">Fullscreen</div><div class="sub">Enter or leave browser fullscreen when supported</div></div><span>›</span></div><div class="setting-row" onclick="resetAllData()" style="cursor:pointer"><div class="grow"><div class="title" style="color:#c73643">Reset NovaDroid</div><div class="sub">Clear saved notes, tasks, messages, photos and settings</div></div><span>›</span></div></div><div style="text-align:center;color:var(--muted);font-size:12px;padding:10px">NovaDroid Web OS 2026 Ultra • state schema v${STATE_VERSION}</div></div></section>`}
function setAccent(c){state.settings.accent=c;persist();renderSettings()}
function nextWallpaper(){state.settings.wallpaper=(state.settings.wallpaper+1)%4;persist();toast('Wallpaper changed')}
function resetAllData(){showModal({title:'Reset NovaDroid?',body:'This clears locally saved app data for this simulation. Camera photos stored in IndexedDB will also be removed.',confirm:'Reset',danger:true,onConfirm:async()=>{localStorage.removeItem('novadroid-state');localStorage.removeItem('novadroid-recovery-log');await clearPhotoDB();try{await wakeLock?.release?.()}catch{}location.reload()}})}

let dial='';function renderPhone(){$('#app-window').innerHTML=`<section class="app-page">${appBar('Phone')}<div style="text-align:center;min-height:90px;padding:14px"><div id="dial-number" style="font-size:30px;letter-spacing:1px;min-height:42px">${esc(dial)}</div><div class="sub">Local simulation — no real calls are placed</div></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`<button onclick="dialPress('${n}')">${n}</button>`).join('')}</div><button class="call-btn" onclick="makeCall()">${SVG.phone}</button><div class="scroll" style="padding:0 14px"><h3>Recent</h3>${state.calls.slice(0,5).map(c=>`<div class="list-row"><div class="avatar">${esc(c.number.slice(-1)||'?')}</div><div class="grow"><div class="title">${esc(c.number)}</div><div class="sub">${esc(c.time)}</div></div></div>`).join('')||'<div class="sub">No recent calls</div>'}</div></section>`}
function dialPress(n){dial+=n;haptic(7);renderPhone()}
function makeCall(){if(!dial)return toast('Enter a number');state.calls.unshift({number:dial,time:new Date().toLocaleString()});saveState();showModal({title:`Calling ${dial}`,body:'This is a safe simulation. The browser is not placing a real telephone call.',confirm:'End call',onConfirm:()=>{dial='';renderPhone()}})}

function renderMessages(){if(currentChatId){const c=state.messages.find(x=>x.id===currentChatId);$('#app-window').innerHTML=`<section class="app-page">${appBar(c.name,iconButton('Back',backSvg(),'currentChatId=null;renderMessages()'))}<div id="chat-history" class="scroll" style="flex:1;padding:10px 14px;display:flex;flex-direction:column">${c.history.map(m=>`<div class="bubble ${m.who==='me'?'me':'them'}">${esc(m.text)}</div>`).join('')}</div><div class="compose-row"><input id="message-input" placeholder="Message" onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">➤</button></div></section>`;setTimeout(()=>{const h=$('#chat-history');if(h)h.scrollTop=h.scrollHeight},0);return}$('#app-window').innerHTML=`<section class="app-page">${appBar('Messages',iconButton('New message','+','newConversation()'))}<div class="scroll" style="flex:1">${state.messages.map(c=>{const last=c.history.at(-1)?.text||'';return `<button class="list-row" style="width:100%;background:transparent;color:inherit;text-align:left" onclick="openChat('${c.id}')"><div class="avatar">${esc(c.name.charAt(0).toUpperCase())}</div><div class="grow"><div class="title">${esc(c.name)}</div><div class="sub truncate">${esc(last)}</div></div></button>`}).join('')}</div></section>`}
function openChat(id){currentChatId=id;renderMessages()}
function newConversation(){showModal({title:'New conversation',fields:[{id:'name',placeholder:'Contact name'}],onConfirm:v=>{if(!v.name.trim())return;const c={id:uid(),name:v.name.trim(),history:[]};state.messages.unshift(c);currentChatId=c.id;saveState();renderMessages()}})}
function sendMessage(){const input=$('#message-input'),text=input?.value.trim();if(!text)return;const c=state.messages.find(x=>x.id===currentChatId);c.history.push({who:'me',text,at:Date.now()});saveState();renderMessages();setTimeout(()=>{const replies=['Got it.','Sounds good.','I’m a local simulated contact, but the messaging UI is working.','Nice — try another app from the launcher too.'];c.history.push({who:'them',text:replies[Math.floor(Math.random()*replies.length)],at:Date.now()});saveState();if(state.currentApp==='messages'&&currentChatId===c.id)renderMessages();else notify('Messages',c.name,c.history.at(-1).text)},850)}

let browserHistory=[],browserIndex=-1;
function renderWeb(){const current=browserIndex>=0?browserHistory[browserIndex]:'';$('#app-window').innerHTML=`<section class="app-page" style="background:var(--surface)"><div class="browser-bar"><div class="browser-nav"><button class="icon-btn" onclick="browserBack()" ${browserIndex<=0?'disabled':''} aria-label="Browser back">‹</button><button class="icon-btn" onclick="browserForward()" ${browserIndex<0||browserIndex>=browserHistory.length-1?'disabled':''} aria-label="Browser forward">›</button><button class="icon-btn" onclick="browserHome()" aria-label="Browser home">⌂</button></div><input id="browser-input" value="${esc(current)}" placeholder="Search or enter URL" onkeydown="if(event.key==='Enter')browserGo()"><button class="icon-btn" onclick="browserGo()" aria-label="Go">→</button></div><div id="browser-content" style="flex:1;display:flex;flex-direction:column"><div class="browser-home"><h2>Nova Web</h2><p>Safer embedded browsing with local history. Search queries open externally because major search engines normally block iframe embedding.</p><div class="card" style="text-align:left;margin-top:24px"><b>Quick links</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="chip" onclick="browserSet('https://developer.android.com')">Android Developers</button><button class="chip" onclick="browserSet('https://www.wikipedia.org')">Wikipedia</button><button class="chip" onclick="browserSet('https://www.openstreetmap.org')">OpenStreetMap</button></div></div></div></div></section>`;if(current)browserLoad(current,false)}
function browserSet(url){$('#browser-input').value=url;browserGo()}
function browserHome(){browserIndex=-1;browserHistory=[];renderWeb()}
function normalizeBrowserInput(raw){raw=String(raw||'').trim();if(!raw)return null;if(!/^https?:\/\//i.test(raw)){if(raw.includes('.')&&!raw.includes(' '))raw='https://'+raw;else return {search:raw}}try{const u=new URL(raw);if(!['http:','https:'].includes(u.protocol))return null;return {url:u.href}}catch{return null}}
function browserGo(){const result=normalizeBrowserInput($('#browser-input')?.value);if(!result)return toast('Invalid address');if(result.search){const target='https://www.google.com/search?q='+encodeURIComponent(result.search);openExternal(target);$('#browser-content').innerHTML=`<div class="browser-home"><h2>Search opened externally</h2><p>For reliability and security, Nova Web does not iframe search-engine result pages.</p><button class="chip" onclick="openExternal('${encodeURIComponent(target).replace(/'/g,'%27')}',true)">Open search again</button></div>`;return}browserHistory=browserHistory.slice(0,browserIndex+1);browserHistory.push(result.url);browserIndex=browserHistory.length-1;browserLoad(result.url,false)}
function browserLoad(url,updateInput=true){const u=new URL(url);if(updateInput&&$('#browser-input'))$('#browser-input').value=u.href;$('#browser-content').innerHTML=`<div class="browser-status"><span class="grow truncate">${esc(u.hostname)}</span><span>Sandboxed</span><button class="chip" onclick="openExternal('${encodeURIComponent(u.href).replace(/'/g,'%27')}',true)">Open externally</button></div><iframe class="browser-frame" title="Embedded website" sandbox="allow-forms allow-scripts allow-popups" referrerpolicy="no-referrer" loading="lazy" src="${esc(u.href)}"></iframe>`;if($('#browser-input'))$('#browser-input').value=u.href}
function browserBack(){if(browserIndex>0){browserIndex--;renderWeb()}}
function browserForward(){if(browserIndex<browserHistory.length-1){browserIndex++;renderWeb()}}
function openExternal(value,encoded=false){const url=encoded?decodeURIComponent(value):value;try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error();const win=window.open(u.href,'_blank','noopener,noreferrer');if(!win)toast('Pop-up blocked by the browser')}catch{toast('Invalid external URL')}}

function renderCamera(){$('#app-window').innerHTML=`<section class="app-page camera"><video id="camera-feed" autoplay playsinline muted></video><div id="camera-msg" class="camera-message">Requesting camera access…</div><div class="camera-controls"><button class="thumb" onclick="openApp('photos')" id="camera-thumb"></button><button class="shutter" onclick="capturePhoto()" aria-label="Take photo"><i></i></button><button class="icon-btn" style="background:rgba(255,255,255,.16);color:#fff" onclick="switchCamera()">↻</button></div><canvas id="camera-canvas" class="hidden"></canvas></section>`;startCamera();loadPhotoThumb()}
async function startCamera(){cleanupCamera();const video=$('#camera-feed'),msg=$('#camera-msg');if(!video||!msg||state.currentApp!=='camera')return;if(!navigator.mediaDevices?.getUserMedia){msg.textContent='Camera API is not available in this browser.';return}try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cameraFacing}},audio:false});if(state.currentApp!=='camera'||!$('#camera-feed')){stream.getTracks().forEach(t=>t.stop());return}cameraStream=stream;video.srcObject=stream;await video.play();msg.classList.add('hidden')}catch(e){recordRuntimeError('camera',e);if(msg?.isConnected)msg.textContent='Camera permission was denied or no camera is available.'}}
function cleanupCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}if(cameraThumbUrl){URL.revokeObjectURL(cameraThumbUrl);cameraThumbUrl=null}}
async function switchCamera(){cameraFacing=cameraFacing==='environment'?'user':'environment';await startCamera()}
async function capturePhoto(){const v=$('#camera-feed'),c=$('#camera-canvas');if(!cameraStream||!v.videoWidth)return toast('Camera is not ready');c.width=v.videoWidth;c.height=v.videoHeight;const ctx=c.getContext('2d');if(cameraFacing==='user'){ctx.translate(c.width,0);ctx.scale(-1,1)}ctx.drawImage(v,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));await putPhoto(blob);haptic(25);toast('Photo saved');loadPhotoThumb()}

let dbPromise;
function initDB(){if(!('indexedDB'in window)){photoStorageMode='memory';dbPromise=Promise.resolve(null);return dbPromise}dbPromise=new Promise(resolve=>{try{const req=indexedDB.open('novadroid-db',2);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'})};req.onsuccess=()=>{photoStorageMode='indexeddb';resolve(req.result)};req.onerror=()=>{photoStorageMode='memory';recordRuntimeError('indexeddb',req.error);resolve(null)};req.onblocked=()=>{photoStorageMode='memory';recordRuntimeError('indexeddb','Database open was blocked');resolve(null)}}catch(e){photoStorageMode='memory';recordRuntimeError('indexeddb',e);resolve(null)}});return dbPromise}
async function putPhoto(blob){const db=await dbPromise;if(!db){memoryPhotos.unshift({id:uid(),created:Date.now(),blob});return}await new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put({id:uid(),created:Date.now(),blob});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function getPhotos(){const db=await dbPromise;if(!db)return [...memoryPhotos].sort((a,b)=>b.created-a.created);return await new Promise((res,rej)=>{const req=db.transaction('photos').objectStore('photos').getAll();req.onsuccess=()=>res(req.result.sort((a,b)=>b.created-a.created));req.onerror=()=>rej(req.error)})}
async function deletePhoto(id){const db=await dbPromise;if(!db){const i=memoryPhotos.findIndex(p=>p.id===id);if(i>=0)memoryPhotos.splice(i,1);return}await new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function clearPhotoDB(){memoryPhotos.length=0;try{const db=await dbPromise;if(!db)return;await new Promise(res=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').clear();tx.oncomplete=res;tx.onerror=res})}catch{}}
function trackPhotoUrl(blob){const url=URL.createObjectURL(blob);photoObjectUrls.add(url);return url}
function revokePhotoObjectUrls(){for(const url of photoObjectUrls)URL.revokeObjectURL(url);photoObjectUrls.clear()}
async function loadPhotoThumb(){const t=$('#camera-thumb');if(!t)return;try{const ps=await getPhotos();if(!t.isConnected||state.currentApp!=='camera')return;if(cameraThumbUrl){URL.revokeObjectURL(cameraThumbUrl);cameraThumbUrl=null}if(!ps.length){t.innerHTML='';return}cameraThumbUrl=URL.createObjectURL(ps[0].blob);t.innerHTML=`<img src="${cameraThumbUrl}" alt="Latest photo">`}catch(e){recordRuntimeError('photos',e);t.innerHTML=''}}
async function renderPhotos(){revokePhotoObjectUrls();$('#app-window').innerHTML=`<section class="app-page">${appBar('Photos')}<div id="photos-grid" class="photos-grid scroll" style="flex:1"></div></section>`;const grid=$('#photos-grid');try{const ps=await getPhotos();photoCache.splice(0,photoCache.length,...ps);grid.innerHTML=ps.length?ps.map(p=>{const url=trackPhotoUrl(p.blob);return `<button class="photo" onclick="openPhoto('${p.id}')"><img src="${url}" alt="Photo captured ${esc(new Date(p.created).toLocaleString())}"></button>`}).join(''):`<div class="empty" style="grid-column:1/-1">No photos yet. Capture one in Camera.${photoStorageMode==='memory'?'<br><small>IndexedDB unavailable: photos are session-only.</small>':''}</div>`}catch(e){recordRuntimeError('photos',e);grid.innerHTML='<div class="empty" style="grid-column:1/-1">Photo storage is unavailable.</div>'}}
async function openPhoto(id){const p=photoCache.find(x=>x.id===id);if(!p)return;const url=trackPhotoUrl(p.blob),viewer=document.createElement('div');viewer.id='photo-viewer';viewer.className='viewer';viewer.dataset.url=url;viewer.innerHTML=`<img src="${url}" alt="Selected photo"><div class="viewer-actions"><button onclick="closePhotoViewer()" aria-label="Close photo">←</button><button onclick="downloadPhoto('${id}')" aria-label="Download photo">↓</button><button onclick="confirmDeletePhoto('${id}')" aria-label="Delete photo">⌫</button></div>`;$('#app-window').append(viewer)}
function closePhotoViewer(){const v=$('#photo-viewer');if(!v)return;const url=v.dataset.url;if(url){URL.revokeObjectURL(url);photoObjectUrls.delete(url)}v.remove()}
function downloadPhoto(id){const p=photoCache.find(x=>x.id===id);if(!p)return;const url=URL.createObjectURL(p.blob),a=document.createElement('a');a.href=url;a.download=`novadroid-photo-${p.created}.jpg`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0)}
function confirmDeletePhoto(id){showModal({title:'Delete photo?',body:'This permanently removes the photo from NovaDroid local storage.',confirm:'Delete',danger:true,onConfirm:async()=>{await deletePhoto(id);closePhotoViewer();renderPhotos()}})}

function renderCalendar(){const year=calCursor.getFullYear(),month=calCursor.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),today=new Date();const cells=[];for(let i=0;i<first;i++)cells.push('<div class="day blank">0</div>');for(let d=1;d<=days;d++){const iso=localISO(new Date(year,month,d)),isToday=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear(),has=state.events.some(e=>e.date===iso);cells.push(`<button class="day ${isToday?'today':''} ${has?'has-event':''}" onclick="calendarDay('${iso}')"><span>${d}</span></button>`)}$('#app-window').innerHTML=`<section class="app-page">${appBar(calCursor.toLocaleDateString([], {month:'long',year:'numeric'}),`<button class="icon-btn" onclick="changeMonth(-1)">‹</button><button class="icon-btn" onclick="changeMonth(1)">›</button>`)}<div class="calendar-head"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div><div class="calendar-grid">${cells.join('')}</div><div class="scroll" style="padding:8px 14px 80px"><h3>Events</h3>${state.events.filter(e=>e.date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="card" style="margin-bottom:8px"><div class="title">${esc(e.title)}</div><div class="sub">${esc(e.date)}</div></div>`).join('')||'<div class="sub">No events this month</div>'}</div><button class="fab" onclick="calendarDay('${localISO(today)}')">+</button></section>`}
function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function changeMonth(dir){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+dir,1);renderCalendar()}
function calendarDay(date){showModal({title:'Add event',fields:[{id:'title',placeholder:'Event title'},{id:'date',type:'date',value:date}],onConfirm:v=>{if(!v.title.trim())return;state.events.push({id:uid(),title:v.title.trim(),date:v.date||date});saveState();renderCalendar()}})}

function renderMaps(){$('#app-window').innerHTML=`<section class="app-page" style="padding-top:36px"><div class="map-search"><input id="map-query" placeholder="Search OpenStreetMap" onkeydown="if(event.key==='Enter')mapSearch()"><button onclick="mapSearch()">⌕</button></div><iframe class="map-frame" title="OpenStreetMap" src="https://www.openstreetmap.org/export/embed.html?bbox=-1.36%2C50.68%2C-1.05%2C50.86&amp;layer=mapnik"></iframe></section>`}
function mapSearch(){const q=$('#map-query')?.value.trim();if(!q)return;window.open('https://www.openstreetmap.org/search?query='+encodeURIComponent(q),'_blank','noopener');toast('Opened OpenStreetMap search externally')}

function renderMail(){if(currentEmailId){const e=state.emails.find(x=>x.id===currentEmailId);e.read=true;saveState();$('#app-window').innerHTML=`<section class="app-page">${appBar(e.subject,iconButton('Back',backSvg(),'currentEmailId=null;renderMail()'))}<div class="scroll" style="padding:10px 18px"><div style="display:flex;gap:12px;align-items:center;margin-bottom:22px"><div class="avatar">${esc(e.from[0])}</div><div><div class="title">${esc(e.from)}</div><div class="sub">${esc(e.time)}</div></div></div><div style="white-space:pre-wrap;line-height:1.6">${esc(e.body)}</div></div></section>`;return}$('#app-window').innerHTML=`<section class="app-page">${appBar('Mail',iconButton('Compose','+','composeMail()'))}<div class="scroll" style="flex:1">${state.emails.map(e=>`<button class="list-row ${!e.read?'mail-unread':''}" style="width:100%;background:transparent;color:inherit;text-align:left" onclick="openEmail('${e.id}')"><div class="avatar" style="background:#d45d65">${esc(e.from[0])}</div><div class="grow"><div class="title">${esc(e.from)}</div><div class="sub truncate">${esc(e.subject)}</div><div class="sub truncate">${esc(e.body)}</div></div><small class="muted">${esc(e.time)}</small></button>`).join('')}</div></section>`}
function openEmail(id){currentEmailId=id;renderMail()}
function composeMail(){showModal({title:'Compose local mail',body:'This creates a simulated local message; it does not send email over the internet.',fields:[{id:'to',placeholder:'Recipient'},{id:'subject',placeholder:'Subject'},{id:'body',type:'textarea',placeholder:'Message'}],confirm:'Save draft',onConfirm:v=>{state.emails.unshift({id:uid(),from:`Draft to ${v.to||'recipient'}`,subject:v.subject||'(no subject)',body:v.body,time:'Draft',read:true});saveState();renderMail();toast('Draft saved locally')}})}

function renderTasks(){$('#app-window').innerHTML=`<section class="app-page">${appBar('Tasks')}<div class="scroll" style="flex:1;padding:0 14px 90px">${state.tasks.map(t=>`<div class="card task-row ${t.done?'done':''}" style="display:flex;align-items:center;gap:12px;margin-bottom:9px"><button class="checkbox ${t.done?'on':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</button><div class="grow task-text">${esc(t.text)}</div><button class="icon-btn" onclick="deleteTask('${t.id}')">×</button></div>`).join('')||'<div class="empty">No tasks</div>'}</div><button class="fab" onclick="addTask()">+</button></section>`}
function addTask(){showModal({title:'New task',fields:[{id:'text',placeholder:'What needs doing?'}],onConfirm:v=>{if(!v.text.trim())return;state.tasks.unshift({id:uid(),text:v.text.trim(),done:false});saveState();renderTasks()}})}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(t)t.done=!t.done;saveState();renderTasks()}
function deleteTask(id){state.tasks=state.tasks.filter(t=>t.id!==id);saveState();renderTasks()}

let selectedFiles=[];function renderFiles(){$('#app-window').innerHTML=`<section class="app-page">${appBar('Files')}<label class="files-drop" for="file-picker"><b>Choose local files</b><div class="sub">Files stay in your browser session; NovaDroid does not upload them.</div></label><input id="file-picker" class="hidden" type="file" multiple><div id="file-list" class="scroll" style="flex:1"></div></section>`;$('#file-picker').onchange=e=>{selectedFiles=[...e.target.files];renderFileList()};renderFileList()}
function renderFileList(){const list=$('#file-list');if(!list)return;list.innerHTML=selectedFiles.length?selectedFiles.map((f,i)=>`<div class="list-row"><div class="avatar" style="background:#4a88e8">F</div><div class="grow"><div class="title truncate">${esc(f.name)}</div><div class="sub">${formatBytes(f.size)} • ${esc(f.type||'unknown type')}</div></div><button class="icon-btn" onclick="openLocalFile(${i})">↗</button></div>`).join(''):'<div class="empty">No local files selected</div>'}
function formatBytes(n){if(n<1024)return`${n} B`;if(n<1048576)return`${(n/1024).toFixed(1)} KB`;return`${(n/1048576).toFixed(1)} MB`}
function openLocalFile(i){const f=selectedFiles[i];if(!f)return;const url=URL.createObjectURL(f);const win=window.open(url,'_blank','noopener,noreferrer');if(!win)toast('Pop-up blocked by the browser');setTimeout(()=>URL.revokeObjectURL(url),60000)}

function renderTerminal(){window.terminalLines=window.terminalLines||['NovaDroid shell 2026','Type “help” for commands.'];$('#app-window').innerHTML=`<section class="app-page">${appBar('Terminal')}<div class="terminal"><div id="term-out" class="terminal-output">${esc(window.terminalLines.join('\n'))}</div><div class="terminal-row"><span>nova$</span><input id="term-input" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')runCommand()"></div></div></section>`;setTimeout(()=>$('#term-input')?.focus(),20)}
function runCommand(){const input=$('#term-input'),raw=input.value.trim();input.value='';if(!raw)return;const [cmd,...args]=raw.split(/\s+/);window.terminalLines.push(`nova$ ${raw}`);const out=(s)=>window.terminalLines.push(String(s));switch(cmd.toLowerCase()){case'help':out('help, date, apps, open <app>, theme, online, storage, clear, echo <text>');break;case'date':out(new Date().toString());break;case'apps':out(APPS.map(a=>a.id).join(', '));break;case'open':if(appById(args[0])){openApp(args[0]);return}else out('Unknown app');break;case'theme':state.settings.dark=!state.settings.dark;persist();out(`dark=${state.settings.dark}`);break;case'online':out(navigator.onLine?'online':'offline');break;case'storage':out(`localStorage ≈ ${formatBytes(new Blob(Object.values(localStorage)).size)}`);break;case'clear':window.terminalLines=[];break;case'echo':out(args.join(' '));break;default:out(`command not found: ${cmd}`)}renderTerminal()}

async function renderLab(){if(state.currentApp!=='lab')return;const ua=navigator.userAgentData?.platform||navigator.platform||'Browser';let battery='Unavailable';try{if(navigator.getBattery){const b=await navigator.getBattery();battery=`${Math.round(b.level*100)}%${b.charging?' ⚡':''}`}}catch{}const mem=navigator.deviceMemory?`${navigator.deviceMemory} GB hint`:'Unavailable';const cores=navigator.hardwareConcurrency||'Unknown';const storage=await navigator.storage?.estimate?.().catch(()=>null);const used=storage?.usage!=null?formatBytes(storage.usage):'Unknown';const tests=await runSelfTests();if(state.currentApp!=='lab')return;const testHtml=tests.map(t=>`<div class="diagnostic-item"><i class="diagnostic-dot ${t.level}"></i><div class="diagnostic-copy"><b>${esc(t.name)}</b><span>${esc(t.detail)}</span></div></div>`).join('');const errs=runtimeErrors.slice(-5).reverse();$('#app-window').innerHTML=`<section class="app-page">${appBar('Device Lab')}<div class="diag-grid scroll" style="flex:1;padding-bottom:18px"><div class="diag"><span class="muted">Connectivity</span><strong>${navigator.onLine?'Online':'Offline'}</strong></div><div class="diag"><span class="muted">Battery</span><strong>${esc(battery)}</strong></div><div class="diag"><span class="muted">CPU threads</span><strong>${esc(cores)}</strong></div><div class="diag"><span class="muted">Memory</span><strong>${esc(mem)}</strong></div><div class="diag"><span class="muted">Viewport</span><strong>${innerWidth}×${innerHeight}</strong></div><div class="diag"><span class="muted">Storage used</span><strong>${esc(used)}</strong></div><div class="card" style="grid-column:1/-1"><div class="title">Platform</div><div class="sub" style="margin-top:7px;word-break:break-word">${esc(ua)}</div></div><div class="card" style="grid-column:1/-1"><div class="title">Capabilities</div><div class="sub" style="line-height:1.8;margin-top:8px">Camera: ${navigator.mediaDevices?.getUserMedia?'Yes':'No'}<br>Photo storage: ${esc(photoStorageMode)}<br>Vibration: ${navigator.vibrate?'Yes':'No'}<br>Clipboard: ${navigator.clipboard?'Yes':'No'}<br>Web Share: ${navigator.share?'Yes':'No'}<br>Wake Lock: ${navigator.wakeLock?'Yes':'No'}<br>Fullscreen: ${document.fullscreenEnabled?'Yes':'No'}<br>File System Access: ${'showOpenFilePicker'in window?'Yes':'No'}</div></div><div class="card" style="grid-column:1/-1"><div class="title">Self-test</div><div class="sub">${tests.filter(t=>t.level==='pass').length}/${tests.length} checks passed without warnings.</div><div class="diagnostic-list">${testHtml}</div><div class="action-row"><button onclick="renderLab()">Run again</button></div></div><div class="card" style="grid-column:1/-1"><div class="title">Runtime errors</div>${errs.length?`<div class="diagnostic-list">${errs.map(e=>`<div class="diagnostic-item"><i class="diagnostic-dot fail"></i><div class="diagnostic-copy"><b>${esc(e.source)}</b><span>${esc(new Date(e.at).toLocaleTimeString())} — ${esc(e.message)}</span></div></div>`).join('')}</div>`:'<div class="sub" style="margin-top:8px">No captured runtime errors in this session.</div>'}</div></div></section>`}
async function runSelfTests(){const out=[];const add=(name,ok,detail,warn=false)=>out.push({name,level:ok?'pass':warn?'warn':'fail',detail});const ids=APPS.map(a=>a.id);add('Unique app IDs',new Set(ids).size===ids.length,new Set(ids).size===ids.length?'All app identifiers are unique.':'Duplicate app identifiers detected.');const renderers={calculator:renderCalculator,clock:renderClock,notes:renderNotes,settings:renderSettings,phone:renderPhone,messages:renderMessages,web:renderWeb,camera:renderCamera,photos:renderPhotos,calendar:renderCalendar,maps:renderMaps,mail:renderMail,tasks:renderTasks,files:renderFiles,terminal:renderTerminal,lab:renderLab};add('Renderer coverage',APPS.every(a=>typeof renderers[a.id]==='function'),'Every registered app has a renderer.');let storageOK=false;try{const k='novadroid-selftest';localStorage.setItem(k,'1');storageOK=localStorage.getItem(k)==='1';localStorage.removeItem(k)}catch{}add('Persistent state storage',storageOK,storageOK?'localStorage round-trip succeeded.':'localStorage is unavailable or blocked.',!storageOK);add('Photo persistence',photoStorageMode==='indexeddb',photoStorageMode==='indexeddb'?'IndexedDB photo store is active.':'Using in-memory photo fallback for this session.',photoStorageMode!=='indexeddb');const dupIds=$$('[id]').map(x=>x.id).filter((id,i,a)=>a.indexOf(id)!==i);add('DOM ID integrity',dupIds.length===0,dupIds.length?'Duplicate DOM IDs: '+dupIds.join(', '):'No duplicate IDs detected.');add('Object URL API',typeof URL.createObjectURL==='function','Blob URL lifecycle support is available.',typeof URL.createObjectURL!=='function');add('Camera cleanup invariant',!cameraStream||state.currentApp==='camera',!cameraStream||state.currentApp==='camera'?'No orphaned camera stream detected.':'A camera stream is active outside Camera.');return out}
function recordRuntimeError(source,error){const message=String(error?.message||error),now=Date.now(),last=runtimeErrors.at(-1);if(last&&last.source===source&&last.message===message&&now-last.at<3000)return;runtimeErrors.push({at:now,source,message});runtimeErrors=runtimeErrors.slice(-20)}
function bindRuntimeGuards(){window.addEventListener('error',e=>recordRuntimeError('window',e.error||e.message));window.addEventListener('unhandledrejection',e=>recordRuntimeError('promise',e.reason));$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeModal()});$('#modal').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const focusable=$$('button,input,textarea,select,[tabindex]:not([tabindex="-1"])',$('#dialog')).filter(el=>!el.disabled);if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}})}
async function syncWakeLock(){if(!state.settings.keepAwake){try{await wakeLock?.release?.()}catch{}wakeLock=null;return}if(document.hidden||!navigator.wakeLock?.request)return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener?.('release',()=>{wakeLock=null})}catch(e){recordRuntimeError('wake-lock',e)}}
async function toggleFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Fullscreen is not supported')}catch(e){recordRuntimeError('fullscreen',e);toast('Fullscreen request was blocked')}}
function exportBackup(){try{const payload={format:'novadroid-backup',version:STATE_VERSION,exportedAt:new Date().toISOString(),state:clone(state)};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`novadroid-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0);toast('Backup exported')}catch(e){recordRuntimeError('backup',e);toast('Backup export failed')}}
function importBackup(){const input=document.createElement('input');input.type='file';input.accept='application/json,.json';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());const candidate=parsed?.format==='novadroid-backup'?parsed.state:parsed;state=normalizeState(candidate);saveState();applySettings();renderLauncher();renderShade();appStack=[];goHome();toast('Backup imported')}catch(e){recordRuntimeError('backup-import',e);toast('Invalid backup file')}};input.click()}



Object.assign(window,{unlock,openDrawer,closeDrawer,openShade,closeShade,showRecents,goHome,systemBack,openApp,closeApp,toggleSetting,clearNotifications,clearRecents,openPalette,closePalette,closeModal,renderCalculator,calcPress,renderClock,toggleStopwatch,resetStopwatch,setTimerMinutes,toggleTimer,resetTimer,newNote,editNote,saveNote,deleteNote,renderSettings,setAccent,nextWallpaper,resetAllData,dialPress,makeCall,openChat,newConversation,sendMessage,browserHome,browserGo,browserSet,browserBack,browserForward,openExternal,renderCamera,switchCamera,capturePhoto,renderPhotos,openPhoto,closePhotoViewer,downloadPhoto,confirmDeletePhoto,changeMonth,calendarDay,mapSearch,openEmail,composeMail,addTask,toggleTask,deleteTask,renderFiles,openLocalFile,runCommand,renderLab,toggleFullscreen,exportBackup,importBackup,$});
